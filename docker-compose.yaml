services:
  server:
    build:
      dockerfile: Dockerfile
      context: .
    ports:
      - 9000:9000
    env_file:
      - ./.env
    networks:
      - server-cache
      - server-database
    environment:
      - DBHOST=database
      - DBPORT=5432
      - REDIS_HOST=cache
      - REDIS_PORT=6379
    volumes:
      - server:/srv/public
    depends_on:
      - cache
      - database
  cache:
    build:
      dockerfile: Dockerfile
      context: ./cache
    ports:
      - 6969:6379
    volumes:
      - cache:/data
    networks:
      - server-cache
  database:
    image: postgres:16.15 
    ports:
      - 7000:5432
    volumes:
      - database:/var/lib/postgresql/data
    env_file:
      - ./.env.database
    networks:
      - server-database

volumes:
  cache:
  database:
  server:

networks:
  server-cache:
  server-database: