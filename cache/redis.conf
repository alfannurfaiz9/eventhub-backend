bind                0.0.0.0
port                6379

daemonize            no
logfile             ""
loglevel            notice

protected-mode      yes

save    3600        1
save    300         100
save    60          10000

appendonly          yes
appendfsync         everysec

maxmemory           100mb
maxmemory-policy    allkeys-lru

user                default off
user                superuser on >superuser ~* &* +@all
user                eventhub on >eventhub123 resetchannels ~eventhub:* +@string +ping +del